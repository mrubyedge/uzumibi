[package]
name = "uzumibi-on-cloudflare-spike"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mrubyedge = { version = "2.1.0", features = [
    "no-wasi",
    "mruby-random",
], default-features = false }
uzumibi-gem = "0.6.1"
uzumibi-art-router = ">= 0.3.1"
uzumibi-cloudflare-ext = { path = "../../uzumibi-cloudflare-ext" }
mrubyedge-serde-json = "0.3.0"

[build-dependencies]
mruby-compiler2-sys = "0.5.0"

[features]
default = ["enable-external"]
enable-external = ["uzumibi-cloudflare-ext/enable-external"]
queue = ["enable-external", "uzumibi-cloudflare-ext/queue"]
